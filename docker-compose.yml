services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [backend]
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
